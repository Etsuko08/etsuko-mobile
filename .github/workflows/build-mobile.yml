name: Build Etsuko Mobile (APK & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Web Assets to Native Android
        run: |
          node copy-www.js
          npx cap sync android

      - name: Set Execution Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsuko-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: mobile-v1.0.0
          name: Etsuko Mobile v1.0.0 — Android APK
          body: |
            ### Etsuko Mobile v1.0.0 (Neural Audio Studio)
            - **Installable Android APK** built automatically.
            - Touch-first OLED cyberpunk UI with bottom navigation.
            - Floating mini-player & full-screen swipeable now-playing sheet.
            - Lockscreen playback & MediaSession controls.
            - Background streaming & karaoke synced lyrics.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Validate iOS Native Project
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Web Assets to Native iOS
        run: |
          node copy-www.js
          npx cap sync ios

      - name: Verify Xcode Project Files
        run: |
          ls -la ios/App
          test -f ios/App/App.xcodeproj/project.pbxproj
