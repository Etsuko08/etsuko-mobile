name: Build Etsuko Mobile (APK & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Web Assets to Native Android
        run: |
          node copy-www.js
          npx cap sync android

      - name: Set Execution Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Etsuko APK
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/Etsuko.apk \;
          cp release-apk/Etsuko.apk Etsuko.apk

      - name: Upload Etsuko APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsuko-apk
          path: release-apk/Etsuko.apk
          retention-days: 14

      - name: Create or Update GitHub Release with Etsuko APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: Etsuko Mobile v1.2.0 — Master Overhaul & Discovery Update
          body: |
            ### ⚡ Etsuko Mobile v1.2.0 — Master Overhaul & Discovery Update
            - **Installable Android APK (`Etsuko.apk`)** ready to install.
            - **Massive Discovery Feed:** 24+ curated, high-res carousels with dedicated "See All" collection view and Play All / Shuffle.
            - **Dynamic Multi-Vibe Engine:** Intelligent 11-category vibe detector across Sufi, Punjabi, Bollywood Romance, Pop, Phonk, Hip-Hop, Rock, Lofi, Acoustic, Classical, and EDM.
            - **Strict Cultural Preferences:** Hindi, Urdu, and Punjabi regional sections remain hidden by default until explicitly enabled by user taste.
            - **Spotify Follow Lyrics:** Synced lines with precise top-offset pinning, passed line dimming, smooth scrolling, and auto-direction RTL support.
            - **Downloads Zero-Hang Fix:** Real duration PCM audio buffer generation and fail-safe error handlers.
            - **Live Offline Search:** Instant live filtering of stored offline tracks.
            - **In-App Auto-Updates:** Seamless version check and one-tap update via GitHub Releases.
          files: |
            Etsuko.apk
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Validate iOS Native Project
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Web Assets to Native iOS
        run: |
          node copy-www.js
          npx cap sync ios

      - name: Verify Xcode Project Files
        run: |
          ls -la ios/App
          test -f ios/App/App.xcodeproj/project.pbxproj
