name: Build Etsuko Mobile (APK & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Web Assets to Native Android
        run: |
          node copy-www.js
          npx cap sync android

      - name: Set Execution Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Etsuko APK
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/Etsuko.apk \;
          cp release-apk/Etsuko.apk Etsuko.apk

      - name: Upload Etsuko APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsuko-apk
          path: release-apk/Etsuko.apk
          retention-days: 14

      - name: Create or Update GitHub Release with Etsuko APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.1
          name: Etsuko Mobile v1.3.1 — Unified Queue & Recommended Autoplay
          body: |
            ### ⚡ Etsuko Mobile v1.3.1 — Unified Queue & Recommended Autoplay
            - **Installable Android APK (`Etsuko.apk`)** ready for direct installation.
            - **Unified Queue & Recommended For You:** Recommended For You is the single source of truth for the queue — zero title or keyword search clutter.
            - **Sequential Recommendation Consumption:** Continuous Spotify-style autoplay consuming the next recommended track with real unthrottled audio.
            - **Instant Search:** Removed artificial latency and added LRU query caching with snappy 160ms debounce.
            - **Verified Offline Playback:** Full audio playback, seeking, scrubbing, and duration with zero dummy silence.
            - **Resilient Auto-Update:** Dual-channel check (Fastly CDN + GitHub) with native Android APK installer.
          files: |
            Etsuko.apk
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Validate iOS Native Project
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Web Assets to Native iOS
        run: |
          node copy-www.js
          npx cap sync ios

      - name: Verify Xcode Project Files
        run: |
          ls -la ios/App
          test -f ios/App/App.xcodeproj/project.pbxproj
